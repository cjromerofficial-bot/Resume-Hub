<style>
:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}
/* Layout: slim icon rail left; airy greenhouse workspace with a soft botanical leaf behind frosted-glass cards; prompt bar docked at the bottom */
:root{
  --bg:#f2f3ef; --bg-2:#e9ece4;
  --ink:#1e221f; --muted:#737a73; --faint:#a3a9a2;
  --glass:rgba(255,255,255,.55); --glass-strong:rgba(255,255,255,.78); --glass-edge:rgba(255,255,255,.95);
  --line:rgba(30,40,30,.08);
  --leaf-1:#c9dcb8; --leaf-2:#9fc08a; --vein:#7fa56a;
  --accent:#2f6fe4; --live:#3c9a5f; --live-soft:rgba(60,154,95,.12); --soon:#b07a1c; --soon-soft:rgba(190,140,40,.12);
  --shadow:0 1px 1px rgba(40,50,40,.03),0 14px 34px -18px rgba(40,60,40,.22);
  --shadow-lift:0 2px 4px rgba(40,50,40,.05),0 26px 50px -22px rgba(40,70,40,.35);
  --f-ui:"Montserrat","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101512; --bg-2:#151c17;
  --ink:#e7ece6; --muted:#9aa49b; --faint:#667066;
  --glass:rgba(32,42,35,.5); --glass-strong:rgba(36,48,40,.8); --glass-edge:rgba(255,255,255,.07);
  --line:rgba(255,255,255,.07);
  --leaf-1:#2d4a2f; --leaf-2:#3f6b40; --vein:#5d8f5a;
  --accent:#6f9cff; --live:#6fd39a; --live-soft:rgba(111,211,154,.12); --soon:#e8b65a; --soon-soft:rgba(232,182,90,.12);
  --shadow:0 1px 1px rgba(0,0,0,.3),0 14px 34px -18px rgba(0,0,0,.6);
  --shadow-lift:0 2px 4px rgba(0,0,0,.3),0 26px 50px -22px rgba(0,0,0,.8);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101512; --bg-2:#151c17;
  --ink:#e7ece6; --muted:#9aa49b; --faint:#667066;
  --glass:rgba(32,42,35,.5); --glass-strong:rgba(36,48,40,.8); --glass-edge:rgba(255,255,255,.07);
  --line:rgba(255,255,255,.07);
  --leaf-1:#2d4a2f; --leaf-2:#3f6b40; --vein:#5d8f5a;
  --accent:#6f9cff; --live:#6fd39a; --live-soft:rgba(111,211,154,.12); --soon:#e8b65a; --soon-soft:rgba(232,182,90,.12);
  --shadow:0 1px 1px rgba(0,0,0,.3),0 14px 34px -18px rgba(0,0,0,.6);
  --shadow-lift:0 2px 4px rgba(0,0,0,.3),0 26px 50px -22px rgba(0,0,0,.8);
  color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.6 var(--f-ui);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:10px}
h1,h2,h3{margin:0;font-weight:400;text-wrap:balance}

/* backdrop */
.backdrop{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;background:radial-gradient(1200px 700px at 70% 40%,var(--bg-2),transparent 70%),var(--bg)}
.leaf{position:absolute;left:28%;top:-4%;width:min(980px,90vw);height:auto;opacity:.55;filter:blur(1.5px);transform-origin:70% 10%;animation:breeze 14s ease-in-out infinite}
@keyframes breeze{50%{transform:rotate(1.6deg) translateY(4px)}}

/* shell */
.shell{position:relative;z-index:1;display:grid;grid-template-columns:96px minmax(0,1fr);min-height:100%}
.rail{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;align-items:center;gap:8px;padding:30px 0 22px;background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(14px);border-right:1px solid var(--line);z-index:40}
.rail .sep{width:32px;height:1px;background:var(--line);margin:10px 0 12px}
.rail a,.rail button{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;color:var(--ink);opacity:.72;border:0;background:transparent;cursor:pointer;position:relative;text-decoration:none;transition:background .2s,opacity .2s}
.rail a:hover,.rail button:hover{opacity:1;background:var(--glass)}
.rail a.on{opacity:1;background:var(--glass-strong);box-shadow:var(--shadow)}
.rail svg{width:24px;height:24px}
.rail [data-tip]:hover::after{content:attr(data-tip);position:absolute;left:58px;top:50%;transform:translateY(-50%);white-space:nowrap;font-size:12.5px;font-weight:500;background:var(--ink);color:var(--bg);padding:6px 10px;border-radius:8px;opacity:1}
.rail .grow{flex:1}
.rail a.me,.rail a.me:hover{width:52px;height:52px;padding:0;border-radius:14px;overflow:hidden;opacity:1;filter:none;display:block;background:transparent;box-shadow:0 0 0 3px var(--bg),0 0 0 5px #3b74f0;text-decoration:none;transition:transform .2s}
.rail a.me:hover{transform:scale(1.05)}

.main{min-width:0;padding:clamp(28px,6vh,80px) clamp(16px,6vw,140px) 40px;display:flex;flex-direction:column;min-height:100vh}
.view{flex:1;display:flex;flex-direction:column}

/* home */
.hello{font-size:clamp(30px,3.6vw,46px);line-height:1.22;letter-spacing:-.01em;font-weight:400}
.hello span{display:block}
.hello em{font-style:normal;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:16px;margin-top:44px}
.chip{border:1px solid var(--glass-edge);background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:999px;padding:15px 30px;font-size:16px;font-weight:400;cursor:pointer;box-shadow:var(--shadow);transition:transform .2s,box-shadow .2s;text-decoration:none;display:inline-flex;align-items:center;gap:10px}
.chip:hover{transform:translateY(-2px);box-shadow:var(--shadow-lift)}
.chip .dot{width:7px;height:7px;border-radius:50%}
.chip.more{padding:15px 18px}
.chip.more svg{width:22px;height:22px}
.sub{font-size:clamp(19px,1.8vw,24px);color:var(--muted);font-weight:400;margin:clamp(40px,6vh,64px) 0 24px}

.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px}
.card{position:relative;display:flex;flex-direction:column;gap:14px;padding:14px 14px 20px;border-radius:22px;background:var(--glass);border:1px solid var(--glass-edge);backdrop-filter:blur(18px) saturate(1.1);-webkit-backdrop-filter:blur(18px) saturate(1.1);box-shadow:var(--shadow);text-decoration:none;cursor:pointer;min-width:0;transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s;transform-style:preserve-3d}
.card:hover{box-shadow:var(--shadow-lift)}
.card .ic{width:34px;height:34px;color:var(--ink)}
.card .ic svg{width:34px;height:34px}
.card h3{font-size:15px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;margin:6px 8px 0;line-height:1.5}
.card-img{position:relative;display:block;aspect-ratio:16/10;max-width:100%;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--glass-strong)}
.card-img .fh-title{font-size:clamp(10px,1vw,15px)}
.card-img .pk-scene{transform:scale(.72)}
.card p{margin:0;color:var(--muted);font-size:15px;line-height:1.7}
.status{position:absolute;right:20px;top:22px;font:500 11px/1 var(--f-ui);letter-spacing:.1em;text-transform:uppercase;padding:6px 10px;border-radius:999px;display:inline-flex;align-items:center;gap:6px}
.status i{width:6px;height:6px;border-radius:50%;background:currentColor}
.status.live{color:var(--live);background:var(--live-soft)}
.status.live i{animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.status.soon{color:var(--soon);background:var(--soon-soft)}
.card .go{margin:auto 8px 0;align-self:flex-start;font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;background:var(--ink);color:var(--bg);transition:gap .2s}
.card:hover .go{gap:12px}
.card .go svg{width:16px;height:16px}

/* prompt bar */
.prompt{position:relative;margin-top:clamp(40px,8vh,110px);z-index:10;border-radius:24px;background:var(--glass);border:1px solid var(--glass-edge);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:var(--shadow);padding:22px 26px 20px}
.prompt-row{display:flex;align-items:center;gap:18px}
.prompt-row > svg{width:28px;height:28px;flex:none;color:var(--ink);opacity:.8}
.prompt input{flex:1;min-width:0;border:0;background:transparent;outline:none;font:400 18px var(--f-ui);color:var(--ink);padding:10px 0}
.prompt input::placeholder{color:var(--muted)}
.send{width:52px;height:52px;border-radius:16px;border:1px solid var(--glass-edge);background:var(--glass-strong);display:grid;place-items:center;cursor:pointer;flex:none;box-shadow:var(--shadow)}
.send svg{width:24px;height:24px}
.send:hover{transform:translateX(2px)}
.prompt-tools{display:flex;gap:14px;margin-top:16px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:10px;border:1px solid var(--glass-edge);background:var(--glass);border-radius:999px;padding:10px 20px;font-size:15px;color:var(--muted);cursor:pointer;text-decoration:none;position:relative}
.pill:hover{color:var(--ink)}
.pill svg{width:19px;height:19px}
.menu{position:absolute;left:0;bottom:calc(100% + 10px);min-width:260px;background:var(--glass-strong);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--glass-edge);border-radius:18px;box-shadow:var(--shadow-lift);padding:8px;z-index:20}
.menu a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;text-decoration:none;font-size:14.5px;color:var(--ink)}
.menu a:hover,.menu a.on{background:var(--glass)}
.menu a small{margin-left:auto;font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.results{position:absolute;left:0;right:0;bottom:calc(100% + 12px);background:var(--glass-strong);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--glass-edge);border-radius:20px;box-shadow:var(--shadow-lift);padding:8px;max-height:min(420px,60vh);overflow-y:auto;z-index:20}
.res{display:flex;align-items:flex-start;gap:14px;padding:12px 14px;border-radius:14px;cursor:pointer}
.res.on,.res:hover{background:var(--glass)}
.res .k{font:500 10.5px/1 var(--f-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--faint);padding-top:5px;width:74px;flex:none}
.res b{display:block;font-weight:500;font-size:15px}
.res p{margin:2px 0 0;color:var(--muted);font-size:13.5px;line-height:1.5}
.res-empty{padding:14px;color:var(--muted);font-size:14px}
mark{background:color-mix(in srgb,var(--leaf-2) 45%,transparent);color:inherit;border-radius:3px;padding:0 1px}

/* project detail */
.back{display:inline-flex;align-items:center;gap:10px;font-size:15px;font-weight:600;color:var(--bg);background:var(--ink);text-decoration:none;margin-bottom:28px;align-self:flex-start;padding:12px 22px 12px 16px;border-radius:999px;box-shadow:0 0 0 3px color-mix(in srgb,var(--leaf-2) 55%,transparent),var(--shadow-lift);transition:transform .2s}
.back:hover{transform:translateY(-2px)}
.back svg{width:19px;height:19px}
.back:hover{color:var(--ink)}
.back svg{width:16px;height:16px}
.proj{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:clamp(28px,4vw,64px);align-items:center}
.eyebrow{font-size:12px;font-weight:500;letter-spacing:.3em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.eyebrow .status{position:static}
.proj h1{font-size:clamp(32px,4vw,52px);line-height:1.12;letter-spacing:-.015em;margin:16px 0 18px}
.proj .lede{color:var(--muted);font-size:17px;line-height:1.7;max-width:52ch;margin:0}
.points{list-style:none;margin:26px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.points li{display:flex;gap:12px;align-items:flex-start;font-size:15px}
.points li::before{content:"";width:8px;height:8px;border-radius:50%;margin-top:.55em;flex:none;background:var(--leaf-2);box-shadow:0 0 0 4px color-mix(in srgb,var(--leaf-2) 25%,transparent)}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:24px}
.tags span{font-size:12.5px;padding:6px 12px;border-radius:999px;background:var(--glass);border:1px solid var(--glass-edge);color:var(--muted)}
.cta{display:flex;gap:12px;margin-top:30px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:10px;padding:14px 24px;border-radius:999px;font-weight:500;font-size:15px;text-decoration:none;border:1px solid var(--glass-edge);background:var(--glass);cursor:pointer}
.btn svg{width:18px;height:18px}
.btn.solid{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.solid:hover{transform:translateY(-1px)}
.btn[aria-disabled="true"]{opacity:.55;cursor:default}

.preview{perspective:1600px}
.window{border-radius:22px;background:var(--glass-strong);border:1px solid var(--glass-edge);box-shadow:var(--shadow-lift);overflow:hidden;transform:rotateY(-14deg) rotateX(6deg);transition:transform .7s cubic-bezier(.2,.8,.2,1);text-decoration:none;display:block;color:inherit}
.preview:hover .window{transform:none}
.win-bar{display:flex;align-items:center;gap:7px;padding:12px 16px;border-bottom:1px solid var(--line)}
.win-bar i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.win-bar i:nth-child(1){background:#ff6058}.win-bar i:nth-child(2){background:#ffbd2e}.win-bar i:nth-child(3){background:#29c940}
.win-bar span{margin-left:12px;font:500 11.5px var(--f-mono);color:var(--muted);background:var(--glass);padding:4px 12px;border-radius:7px;flex:1;max-width:280px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.win-body{aspect-ratio:16/10;max-width:100%;position:relative;overflow:hidden}

/* freight mini */
.fh{position:absolute;inset:0;display:grid;grid-template-columns:22% 1fr;background:linear-gradient(135deg,#f6f1ff,#fff3f8)}
.fh-side{background:#fff;border-right:1px solid #eee8f6;padding:8% 10%;display:flex;flex-direction:column;gap:7%}
.fh-side b{display:block;height:9px;border-radius:4px;background:#6a45f5;width:70%}
.fh-side i{display:block;height:6px;border-radius:3px;background:#e8e3f3}
.fh-main{padding:5% 6%;display:flex;flex-direction:column;align-items:center;gap:4%}
.fh-truck{width:46%;height:auto}
.fh-title{font:700 clamp(11px,1.5vw,20px)/1 var(--f-ui);color:#1d1a2b;letter-spacing:-.02em}
.fh-search{width:70%;height:8%;border-radius:6px;background:#fff;box-shadow:0 2px 8px rgba(60,30,140,.08)}
.fh-grid{width:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:4%;margin-top:2%}
.fh-grid div{height:clamp(18px,3.4vw,40px);border-radius:6px;background:#fff;box-shadow:0 2px 6px rgba(60,30,140,.07);display:flex;align-items:center;gap:8%;padding:0 7%}
.fh-grid div::before{content:"";width:22%;aspect-ratio:1;border-radius:4px;background:var(--c)}
.fh-grid div::after{content:"";flex:1;height:4px;border-radius:2px;background:#ece8f4}

/* box 3d (packaging) */
.pk{position:absolute;inset:0;display:grid;place-items:center;background:
  linear-gradient(var(--line) 1px,transparent 1px) 0 0/24px 24px,linear-gradient(90deg,var(--line) 1px,transparent 1px) 0 0/24px 24px}
.pk-scene{width:150px;height:110px;perspective:900px}
.pk-box{position:relative;width:150px;height:110px;transform-style:preserve-3d;transform:rotateX(-22deg) rotateY(-32deg);animation:spin 16s linear infinite}
@keyframes spin{to{transform:rotateX(-22deg) rotateY(328deg)}}
.pk-box i{position:absolute;left:0;top:0;display:grid;place-items:center;font:500 11px var(--f-mono);color:#6b4b1f;border:1px solid rgba(110,75,30,.25)}
.pk-box .f{width:150px;height:110px;background:#e9c48c;transform:translateZ(45px)}
.pk-box .b{width:150px;height:110px;background:#d9ac6a;transform:rotateY(180deg) translateZ(45px)}
.pk-box .r{width:90px;height:110px;left:30px;background:#d1a161;transform:rotateY(90deg) translateZ(75px)}
.pk-box .l{width:90px;height:110px;left:30px;background:#d1a161;transform:rotateY(-90deg) translateZ(75px)}
.pk-box .t{width:150px;height:90px;top:10px;background:#f2d6a8;transform:rotateX(90deg) translateZ(55px)}
.pk-box .t::after{content:"";position:absolute;left:0;right:0;top:50%;height:10px;margin-top:-5px;background:rgba(160,120,60,.35)}
.pk-box .u{width:150px;height:90px;top:10px;background:#c99a57;transform:rotateX(-90deg) translateZ(55px)}
.pk-dims{position:absolute;left:6%;bottom:8%;display:flex;gap:8px;flex-wrap:wrap}
.pk-dims span{font:500 11.5px var(--f-mono);padding:5px 9px;border-radius:7px;background:var(--glass-strong);border:1px solid var(--glass-edge)}

/* bol doc */
.bol{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(160deg,var(--bg-2),var(--bg))}
.bol-doc{width:62%;aspect-ratio:8.5/11;max-height:88%;background:#fffdf8;border-radius:6px;box-shadow:0 18px 40px -16px rgba(0,0,0,.35);transform:rotate(-4deg);padding:6%;display:flex;flex-direction:column;gap:5%;position:relative;color:#2a2a2a}
.bol-doc h4{margin:0;font:600 clamp(9px,1.2vw,14px)/1 var(--f-ui);letter-spacing:.2em}
.bol-row{display:grid;grid-template-columns:1fr 1fr;gap:6%}
.bol-row div{height:clamp(16px,3vw,34px);border:1px solid #ddd6c8;border-radius:3px;position:relative}
.bol-row div::after{content:"";position:absolute;left:8%;right:30%;top:40%;height:3px;background:#e7e0d1;border-radius:2px}
.bol-lines{display:flex;flex-direction:column;gap:6px;flex:1}
.bol-lines i{height:5px;border-radius:3px;background:#ece6d8}
.bol-lines i:nth-child(2n){width:80%}
.bol-stamp{position:absolute;right:8%;bottom:9%;font:700 clamp(8px,1.1vw,12px)/1 var(--f-mono);color:#c0392b;border:2px solid #c0392b;padding:5px 8px;border-radius:4px;transform:rotate(-12deg);opacity:.75;letter-spacing:.1em}
.soon-band{position:absolute;left:0;right:0;bottom:0;padding:12px 18px;font-size:13px;color:var(--muted);background:linear-gradient(transparent,var(--glass-strong) 40%);text-align:center}

/* resume */
.resume{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:22px;margin-top:8px}
.panel{border-radius:22px;background:var(--glass);border:1px solid var(--glass-edge);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:var(--shadow);padding:30px;min-width:0}
.panel h2{font-size:13px;font-weight:500;letter-spacing:.28em;text-transform:uppercase;margin-bottom:18px}
.panel p{margin:0 0 12px;color:var(--muted);line-height:1.75;max-width:62ch}
.skill-grp{margin-bottom:18px}
.skill-grp small{display:block;font-size:12px;font-weight:500;color:var(--faint);letter-spacing:.12em;text-transform:uppercase;margin-bottom:10px}
.plist{display:flex;flex-direction:column;gap:10px}
.plist a{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:16px;text-decoration:none;background:var(--glass);border:1px solid var(--glass-edge)}
.plist a:hover{background:var(--glass-strong)}
.plist svg{width:22px;height:22px;flex:none}
.plist span{flex:1;min-width:0}
.plist .status{position:static}
.xp{display:flex;flex-direction:column;gap:18px}
.xp div{border-left:2px solid var(--leaf-2);padding-left:16px}
.xp b{font-weight:500}
.xp small{display:block;color:var(--faint);font-size:13px}
.links{display:flex;flex-direction:column;gap:10px}
.links a,.links div{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:16px;background:var(--glass);border:1px solid var(--glass-edge);text-decoration:none;font-size:15px;min-width:0;overflow-wrap:anywhere}

  ext:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>',
};
const CHIP_COLORS = {'freight-hub':'#6a45f5','bol-portal':'#2f6fe4','packing-planner':'#d9a35a','pc-music':'#f07a2a'};
const linkAttrs = p => p.external ? 'target="_blank" rel="noopener"' : '';

/* ================= helpers ================= */
const $ = (s,r=document)=>r.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const statusPill = p => p.status==='live'?'<span class="status live"><i></i>Live</span>':'<span class="status soon"><i></i>Coming soon</span>';
const view = $('#view');

/* ================= search ================= */
function buildIndex(){
  const ix=[];
  PROJECTS.forEach(p=>ix.push({kind:'Project',title:p.title,text:[p.card,p.lede,...p.points,...p.tags].join(' '),go:'#project-'+p.id}));
  Object.entries(SITE.skills).forEach(([g,arr])=>arr.forEach(s=>ix.push({kind:'Skill',title:s,text:g+' skill',go:'#resume'})));
  SITE.experience.forEach(x=>ix.push({kind:'Experience',title:`${x.role} · ${x.org}`,text:[x.dates,x.place,...x.bullets].join(' '),go:'#resume'}));
  ix.push({kind:'About',title:'Résumé',text:SITE.summary.join(' ')+' experience skills about resume',go:'#resume'});
  ix.push({kind:'Contact',title:'Contact',text:'contact email linkedin github hire reach',go:'#contact'});
  return ix;
}
const INDEX=buildIndex();
function search(q){
  const ws=q.toLowerCase().split(/\s+/).filter(Boolean);
  return INDEX.map(e=>{const hay=(e.title+' '+e.text).toLowerCase();if(!ws.every(w=>hay.includes(w)))return null;
    let sc=0;ws.forEach(w=>{if(e.title.toLowerCase().includes(w))sc+=5;sc+=hay.split(w).length-1});if(e.kind==='Project')sc+=2;return {...e,sc}}).filter(Boolean).sort((a,b)=>b.sc-a.sc).slice(0,7);
}
function hl(text,q){
  let s=esc(text.length>130?text.slice(0,130)+'…':text);
  q.toLowerCase().split(/\s+/).filter(w=>w.length>1).forEach(w=>{s=s.replace(new RegExp('('+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<mark>$1</mark>')});
  return s;
}

/* ================= views ================= */
function promptBar(top){
  return `<section class="prompt${top?' top':''}" id="prompt">
    <div class="results" id="results" hidden role="listbox"></div>
    <div class="menu" id="projMenu" hidden>${PROJECTS.map(p=>`<a href="#project-${p.id}">${I[p.icon].replace('<svg','<svg width="20" height="20"')}<span>${p.title}</span><small style="color:var(--${p.status==='live'?'live':'soon'})">${p.status==='live'?'Live':'Soon'}</small></a>`).join('')}</div>
    <div class="prompt-row">${I.search}<input id="q" type="search" autocomplete="off" placeholder="Search my projects, skills or experience" aria-label="Search projects, skills or experience"><button class="send" id="sendBtn" aria-label="Go to top result">${I.send}</button></div>
    <div class="prompt-tools"><button class="pill" id="projPill" aria-haspopup="true" aria-expanded="false">${I.grid}Projects${I.chev}</button></div>
  </section>`;
}
function wirePrompt(){
  const q=$('#q'),box=$('#results'),menu=$('#projMenu'),pill=$('#projPill');let items=[],cur=0;
  const render=()=>{const v=q.value.trim();if(v.length<2){box.hidden=true;return}items=search(v);cur=0;
    box.innerHTML=items.length?items.map((r,i)=>`<div class="res${i?'':' on'}" data-i="${i}" role="option"><span class="k">${r.kind}</span><div style="min-width:0"><b>${hl(r.title,v)}</b>${r.kind==='Project'?`<p>${hl(r.text,v)}</p>`:''}</div></div>`).join(''):`<div class="res-empty">Nothing matches “${esc(v)}”. Try “freight”, “BOL” or “packaging”.</div>`;box.hidden=false;menu.hidden=true};
  const go=i=>{const r=items[i];if(r){box.hidden=true;q.value='';location.hash=r.go.slice(1)}};
  q.addEventListener('input',render);q.addEventListener('focus',render);
  q.addEventListener('keydown',e=>{if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(!items.length)return;cur=(cur+(e.key==='ArrowDown'?1:-1)+items.length)%items.length;box.querySelectorAll('.res').forEach((el,i)=>el.classList.toggle('on',i===cur))}else if(e.key==='Enter'){e.preventDefault();go(cur)}else if(e.key==='Escape'){box.hidden=true;q.blur()}});
  q.addEventListener('blur',()=>setTimeout(()=>box.hidden=true,150));
  box.addEventListener('mousedown',e=>{const el=e.target.closest('.res');if(el){e.preventDefault();go(+el.dataset.i)}});
  $('#sendBtn').addEventListener('click',()=>{if(q.value.trim().length<2){q.focus();return}if(!items.length)render();go(cur)});
  pill.addEventListener('click',e=>{e.stopPropagation();menu.hidden=!menu.hidden;pill.setAttribute('aria-expanded',String(!menu.hidden))});
  document.addEventListener('click',e=>{if(!menu.contains(e.target)&&e.target!==pill){menu.hidden=true;pill.setAttribute('aria-expanded','false')}},{once:false});
}

function previewFor(p){
  const bar=`<div class="win-bar"><i></i><i></i><i></i><span>${p.external?'':'/'}${p.url}</span></div>`;
  return `<a class="window" href="${p.href}" ${linkAttrs(p)}>${bar}<div class="win-body">${previewBody(p)}</div></a>`;
}

function renderProject(p){
  const live=p.status==='live';
  const idx=PROJECTS.indexOf(p), next=PROJECTS[(idx+1)%PROJECTS.length];
  view.innerHTML=`
    <a class="back" href="#home">${I.home}Back to all projects</a>
    <section class="proj">
      <div style="min-width:0">
        <div class="eyebrow">Project ${String(idx+1).padStart(2,'0')} / ${String(PROJECTS.length).padStart(2,'0')} ${statusPill(p)}</div>

        <p class="lede">${p.lede}</p>
        <ul class="points">${p.points.map(x=>`<li>${x}</li>`).join('')}</ul>
        <div class="tags">${p.tags.map(t=>`<span>${t}</span>`).join('')}</div>
        ${p.note?`<p class="note">${p.note}</p>`:''}
        <div class="cta">
          ${live?`<a class="btn solid" href="${p.href}" ${linkAttrs(p)}>${p.external?'Visit the live site':'Open the live project'} ${p.external?I.ext:I.arrow}</a>`:`<span class="btn" aria-disabled="true">Demo coming soon</span>`}
          ${p.repo?`<a class="btn" href="${p.repo}" target="_blank" rel="noopener">${I.github}Code on GitHub</a>`:''}
          <a class="btn" href="#project-${next.id}">Next: ${next.title}</a>
        </div>
      </div>
      <div class="preview">${previewFor(p)}</div>
    </section>
    ${promptBar()}`;
  wirePrompt();
}

function renderContact(){
  const c=SITE.contact, rows=[];

  view.innerHTML=`

function tiltCards(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches||matchMedia('(hover: none)').matches) return;
  view.querySelectorAll('.card').forEach(c=>{
    c.addEventListener('mousemove',e=>{const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;c.style.transform=`perspective(900px) rotateX(${(-y*6).toFixed(2)}deg) rotateY(${(x*8).toFixed(2)}deg) translateY(-4px)`});
    c.addEventListener('mouseleave',()=>{c.style.transform=''});
  });
}

/* ================= router ================= */
function route(){
  const h=(location.hash||'#home').slice(1);
  let key='home';
  if(h.startsWith('project-')){const p=PROJECTS.find(x=>'project-'+x.id===h);if(p){renderProject(p);key='project'}else renderHome()}
  else if(h==='resume'){renderResume();key='resume'}
  else if(h==='contact'){renderContact();key='contact'}
  else renderHome();
  document.querySelectorAll('.rail [data-route]').forEach(a=>a.classList.toggle('on',a.dataset.route===key));
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);
function focusSearch(){
  if(!$('#q')){location.hash='home';setTimeout(()=>$('#q')?.focus(),30);return}
  $('#q').scrollIntoView({behavior:'smooth',block:'center'});$('#q').focus({preventScroll:true});
}
$('#searchBtn').addEventListener('click',focusSearch);
$('#backBtn').addEventListener('click',()=>{if(location.hash&&location.hash!=='#home')history.back()});
document.addEventListener('keydown',e=>{if(e.key==='/'&&!/input|textarea/i.test(document.activeElement.tagName)){e.preventDefault();focusSearch()}});
$('#themeBtn').addEventListener('click',()=>{const r=document.documentElement,cur=r.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');r.dataset.theme=cur==='dark'?'light':'dark';store.set('hub-theme',r.dataset.theme)});
(()=>{const t=store.get('hub-theme',null);if(t)document.documentElement.dataset.theme=t})();
$('#yr').textContent=new Date().getFullYear();
route();
</script>
