<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Freight Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}
/* Layout: app shell — soft sidebar left, lavender-washed workspace, 3D truck hero, 3-col topic cards; topic pages = playbook + sticky "on this route" rail */
:root{
  --bg:#f8f6fc; --wash1:#f1e9ff; --wash2:#ffeef6;
  --surface:#ffffff; --surface-2:#faf8fe;
  --ink:#1d1a2b; --muted:#6c6883; --faint:#a19db4;
  --line:#ece8f4; --line-2:#e0daec;
  --accent:#6a45f5; --accent-ink:#ffffff; --accent-soft:#efe9ff;
  --good:#1f9d63; --good-soft:#e2f6ec; --warn:#c77a06; --warn-soft:#fff2db; --bad:#d64545; --bad-soft:#fde7e7;
  --road:#3a3550; --road-line:#f5d76e;
  --shadow:0 1px 2px rgba(40,24,90,.04),0 8px 24px -12px rgba(40,24,90,.12);
  --shadow-lift:0 2px 4px rgba(40,24,90,.05),0 18px 40px -16px rgba(60,30,140,.28);
  --f-display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --f-body:"Plus Jakarta Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:16px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#100e18; --wash1:#1d1534; --wash2:#24142a;
  --surface:#1a1726; --surface-2:#211d30;
  --ink:#eeeaf8; --muted:#a6a1bc; --faint:#6f6a86;
  --line:#2a2639; --line-2:#363149;
  --accent:#a08bff; --accent-ink:#140f26; --accent-soft:#272042;
  --good:#4fd195; --good-soft:#163527; --warn:#f2b44c; --warn-soft:#3a2b12; --bad:#ff7b7b; --bad-soft:#3d1c20;
  --road:#2b2740; --road-line:#d9bd54;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.5);
  --shadow-lift:0 2px 4px rgba(0,0,0,.3),0 18px 40px -16px rgba(0,0,0,.7);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#100e18; --wash1:#1d1534; --wash2:#24142a;
  --surface:#1a1726; --surface-2:#211d30;
  --ink:#eeeaf8; --muted:#a6a1bc; --faint:#6f6a86;
  --line:#2a2639; --line-2:#363149;
  --accent:#a08bff; --accent-ink:#140f26; --accent-soft:#272042;
  --good:#4fd195; --good-soft:#163527; --warn:#f2b44c; --warn-soft:#3a2b12; --bad:#ff7b7b; --bad-soft:#3d1c20;
  --road:#2b2740; --road-line:#d9bd54;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.5);
  --shadow-lift:0 2px 4px rgba(0,0,0,.3),0 18px 40px -16px rgba(0,0,0,.7);
  color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 var(--f-body);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;letter-spacing:-.01em;margin:0}
.mono{font-family:var(--f-mono);font-size:.86em}
mark{background:color-mix(in srgb,var(--accent) 22%,transparent);color:inherit;border-radius:3px;padding:0 1px}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:268px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:18px;padding:26px 20px 22px;background:var(--surface);border-right:1px solid var(--line);z-index:30}
.back-port{display:flex;align-items:center;justify-content:center;gap:9px;font:700 13.5px/1 var(--f-body);color:#fff;text-decoration:none;padding:12px 14px;border-radius:12px;background:#1e221f;box-shadow:0 0 0 3px rgba(159,192,138,.6);margin:-4px 2px 0}.back-port:hover{filter:brightness(1.15)}.back-port svg{width:17px;height:17px}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 18px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
.brand-mark{width:30px;height:30px;position:relative;flex:none}
.brand-mark i{position:absolute;border-radius:50%}
.brand-mark i:nth-child(1){width:20px;height:20px;left:0;top:7px;background:#b9a6ff}
.brand-mark i:nth-child(2){width:18px;height:18px;left:9px;top:0;background:var(--accent);mix-blend-mode:multiply}
.brand b{font:800 21px/1 var(--f-display);letter-spacing:-.02em}
.brand small{display:block;font:600 10.5px/1 var(--f-body);color:var(--muted);letter-spacing:.12em;text-transform:uppercase;margin-top:4px}
.nav{display:flex;flex-direction:column;gap:2px;overflow-y:auto;flex:1;min-height:0;margin:0 -6px;padding:0 6px}
.nav-label{font:700 10.5px/1 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--faint);padding:16px 12px 8px}
.nav a{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:12px;color:var(--muted);text-decoration:none;font-weight:500;transition:background .15s,color .15s}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a.on{background:var(--accent-soft);color:var(--ink);font-weight:600}
.nav a.on svg{color:var(--accent)}
.nav svg{width:20px;height:20px;flex:none}
.nav .dot{width:8px;height:8px;border-radius:3px;flex:none;margin:0 6px}
.tip{position:relative;background:var(--surface-2);border:1px solid var(--line);border-radius:18px;padding:34px 16px 16px;text-align:center}
.tip .bulb{position:absolute;left:50%;top:-22px;width:44px;height:44px;margin-left:-22px;border-radius:50%;background:radial-gradient(circle,#fff6c9 0,#fde89a 45%,transparent 72%);display:grid;place-items:center}
.tip .bulb span{width:14px;height:18px;border-radius:50% 50% 40% 40%;background:#f5c518;box-shadow:0 0 16px #f5c518}
.tip h4{margin:0 0 4px;font:700 15px/1.3 var(--f-display)}
.tip p{margin:0;font-size:12.5px;color:var(--muted);line-height:1.5}

.main{min-width:0;position:relative;background:
  radial-gradient(900px 500px at 0% 0%,var(--wash1),transparent 60%),
  radial-gradient(700px 500px at 100% 100%,var(--wash2),transparent 60%),var(--bg)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;padding:16px clamp(16px,3vw,40px);backdrop-filter:blur(10px);background:color-mix(in srgb,var(--bg) 70%,transparent)}
.top .grow{flex:1;min-width:0}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--muted);flex:none}
.icon-btn:hover{color:var(--ink);border-color:var(--line-2)}
.icon-btn svg{width:19px;height:19px}
.menu-btn{display:none}
.chip-inbox{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;color:var(--muted);font-size:13px;white-space:nowrap}
.chip-inbox:hover{color:var(--ink)}
.chip-inbox svg{width:16px;height:16px}
.who{display:flex;align-items:center;gap:10px;font-weight:600;font-size:14px;white-space:nowrap}
.avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#ffb36b,#ff6f91 55%,#7a5cff);display:grid;place-items:center;color:#fff;font:700 13px/1 var(--f-display);position:relative}
.avatar::after{content:"";position:absolute;right:-1px;bottom:-1px;width:10px;height:10px;border-radius:50%;background:#2fc47a;border:2px solid var(--surface)}

.view{padding:0 clamp(16px,3vw,40px) 64px}

/* ---------- search ---------- */
.search{position:relative;width:100%}
.search input{width:100%;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:16px;padding:16px 64px 16px 50px;font:500 15px var(--f-body);box-shadow:var(--shadow);outline:none;transition:border-color .15s,box-shadow .15s}
.search input::placeholder{color:var(--faint)}
.search input:focus{border-color:color-mix(in srgb,var(--accent) 50%,var(--line));box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 14%,transparent),var(--shadow)}
.search > svg{position:absolute;left:18px;top:50%;width:20px;height:20px;margin-top:-10px;color:var(--accent);pointer-events:none}
.search kbd{position:absolute;right:14px;top:50%;transform:translateY(-50%);font:600 11px var(--f-mono);color:var(--faint);border:1px solid var(--line-2);border-radius:6px;padding:2px 7px;background:var(--surface-2)}
.search.compact input{padding:10px 44px 10px 40px;border-radius:12px;font-size:14px;box-shadow:none}
.search.compact > svg{left:13px;width:17px;height:17px;margin-top:-8.5px}
.search.compact kbd{right:10px}
.results{position:absolute;left:0;right:0;top:calc(100% + 8px);background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-lift);padding:8px;z-index:40;max-height:min(460px,70vh);overflow-y:auto;text-align:left}
.res{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border-radius:12px;cursor:pointer}
.res.on,.res:hover{background:var(--surface-2)}
.res .ti{width:32px;height:32px;border-radius:10px;flex:none;display:grid;place-items:center}
.res .ti svg{width:17px;height:17px}
.res b{display:block;font-weight:600;font-size:14px}
.res b span{color:var(--muted);font-weight:500}
.res p{margin:2px 0 0;font-size:13px;color:var(--muted);line-height:1.45;overflow-wrap:anywhere}
.res-empty{padding:16px;color:var(--muted);font-size:14px}

/* ---------- home ---------- */
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:4px}
.stage{position:relative;width:min(560px,100%);height:270px;margin-bottom:4px}
.orbit{position:absolute;inset:18px 0 6px;width:100%;height:calc(100% - 24px);overflow:visible;pointer-events:none}
.orbit ellipse{fill:none;stroke:var(--faint);stroke-width:1.2;stroke-dasharray:3 6;opacity:.7}
.badge{position:absolute;font:600 11.5px/1 var(--f-mono);padding:7px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);color:var(--ink);display:flex;align-items:center;gap:6px;animation:float 6s ease-in-out infinite}
.badge i{width:8px;height:8px;border-radius:50%}
@keyframes float{50%{transform:translateY(-7px)}}

.scene{position:absolute;inset:0;perspective:1400px;perspective-origin:50% 30%}
.world{position:absolute;left:50%;top:50%;width:0;height:0;transform-style:preserve-3d;transform:translateY(-6px) rotateX(58deg) rotateZ(-34deg) scale(var(--sc,.82));animation:sway 12s ease-in-out infinite}
@keyframes sway{0%,100%{transform:translateY(-6px) rotateX(58deg) rotateZ(-34deg) scale(var(--sc,.82))}50%{transform:translateY(-6px) rotateX(56deg) rotateZ(-26deg) scale(var(--sc,.82))}}
.world *{transform-style:preserve-3d}
.road{position:absolute;left:-260px;top:-90px;width:620px;height:210px;border-radius:26px;background:var(--road);
  box-shadow:0 0 0 10px color-mix(in srgb,var(--road) 35%,transparent)}
.road::before,.road::after{content:"";position:absolute;left:14px;right:14px;height:5px;border-radius:3px;
  background:repeating-linear-gradient(90deg,var(--road-line) 0 34px,transparent 34px 62px);animation:dash 1.1s linear infinite}
.road::before{top:24px}.road::after{bottom:24px}
@keyframes dash{to{background-position:62px 0}}
.cub{position:absolute}
.cub > i{position:absolute;left:0;top:0;display:block}
.truck{position:absolute;left:-150px;top:-35px;animation:bob .5s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateZ(1.2px)}}
.label3d{display:flex;align-items:center;justify-content:center;height:100%;font:800 17px/1 var(--f-display);letter-spacing:.06em;color:#fff}
.label3d small{font:600 9px/1 var(--f-mono);opacity:.75;margin-left:8px;letter-spacing:.1em}
.wheel{position:absolute;width:28px;height:28px;border-radius:50%;background:radial-gradient(circle,#c9c6d6 0 22%,#232031 24% 100%)}
.box-label{display:flex;align-items:center;justify-content:center;height:100%;font:600 7px/1 var(--f-mono);color:#6b4b1f}

.hero h1{font-size:clamp(34px,5vw,50px);font-weight:800;letter-spacing:-.03em;line-height:1.05;margin-top:2px}
.hero .lede{max-width:640px;margin:12px auto 0;color:var(--muted);font-size:16.5px;line-height:1.6;text-wrap:balance}
.hero .search{max-width:720px;margin:28px auto 0}
.quick{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
.quick button{border:1px dashed var(--line-2);background:transparent;border-radius:999px;padding:5px 12px;font-size:12.5px;color:var(--muted);cursor:pointer}
.quick button:hover{border-style:solid;color:var(--ink);background:var(--surface)}

.divider{display:flex;align-items:center;gap:18px;margin:48px auto 22px;max-width:1180px;color:var(--muted);font-size:13.5px;text-align:center}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--line-2))}
.divider::after{background:linear-gradient(270deg,transparent,var(--line-2))}

.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;max-width:1180px;margin:0 auto}
.card{position:relative;display:flex;gap:16px;align-items:flex-start;text-align:left;padding:22px 22px 20px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);cursor:pointer;text-decoration:none;color:var(--ink);transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s;min-width:0}
.card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lift)}
.card:hover .tile{transform:perspective(300px) rotateX(14deg) rotateY(-16deg) translateZ(8px)}
.card .body{min-width:0;flex:1}
.card h3{font-size:18px;font-weight:700;line-height:1.25}
.card p{margin:6px 0 0;color:var(--muted);font-size:14px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.tag{font:600 11px/1 var(--f-body);padding:5px 8px;border-radius:7px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.card .arrow{position:absolute;right:16px;top:18px;width:18px;height:18px;color:var(--faint);opacity:0;transform:translateX(-4px);transition:.2s}
.card:hover .arrow{opacity:1;transform:none}
.tile{width:46px;height:46px;border-radius:14px;flex:none;display:grid;place-items:center;color:#fff;transition:transform .35s cubic-bezier(.2,.8,.2,1);
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.14),inset 0 1px 0 rgba(255,255,255,.35),0 6px 14px -6px var(--tc)}
.tile svg{width:23px;height:23px}

.triage{max-width:1180px;margin:44px auto 0;display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:28px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:28px;box-shadow:var(--shadow)}
.triage h2{font-size:26px;font-weight:800;line-height:1.15}
.triage > div > p{color:var(--muted);margin:10px 0 0;font-size:14.5px}
.tri-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tri{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);cursor:pointer;text-align:left;min-width:0}
.tri:hover{border-color:var(--line-2);background:var(--accent-soft)}
.tri .q{flex:1;min-width:0;font-size:13.5px;line-height:1.4}
.tri .a{font:600 12px/1 var(--f-body);white-space:nowrap;display:flex;align-items:center;gap:6px}
.tri .a i{width:8px;height:8px;border-radius:3px}

/* ---------- topic ---------- */
.crumbs{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--muted);margin:6px 0 18px;flex-wrap:wrap}
.crumbs a{color:var(--muted);text-decoration:none;display:inline-flex;align-items:center;gap:6px;padding:6px 10px 6px 8px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.crumbs a:hover{color:var(--ink)}
.crumbs svg{width:15px;height:15px}
.thead{position:relative;overflow:hidden;border-radius:24px;padding:30px 30px 26px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:center}
.thead::before{content:"";position:absolute;inset:0;background:radial-gradient(500px 220px at 100% 0%,color-mix(in srgb,var(--tc) 16%,transparent),transparent 70%);pointer-events:none}
.thead .tile{width:58px;height:58px;border-radius:18px}
.thead .tile svg{width:29px;height:29px}
.thead .eyebrow{font:700 11px/1 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--tc-ink,var(--muted));margin:16px 0 8px}
.thead h1{font-size:clamp(30px,4vw,42px);font-weight:800;letter-spacing:-.025em;line-height:1.08}
.thead .sum{margin:12px 0 0;color:var(--muted);max-width:64ch;font-size:15.5px}
.facts{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.fact{padding:10px 14px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);min-width:0}
.fact small{display:block;font:700 10px/1 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin-bottom:6px}
.fact b{font:700 14.5px/1.2 var(--f-display);font-variant-numeric:tabular-nums}
.minitruck{width:190px;height:120px;position:relative}
.minitruck svg{width:100%;height:100%;overflow:visible}

.layout{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:28px;margin-top:26px;align-items:start}
.content{display:flex;flex-direction:column;gap:20px;min-width:0}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px 26px;box-shadow:var(--shadow);scroll-margin-top:90px;min-width:0}
.sec.flash{animation:flash 1.6s ease}
@keyframes flash{0%,40%{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 45%,transparent),var(--shadow)}}
.sec h2{font-size:20px;font-weight:700;display:flex;align-items:center;gap:10px;margin-bottom:12px}
.sec h2 .n{font:600 11px/1 var(--f-mono);color:var(--faint);letter-spacing:.06em}
.sec p{margin:0 0 10px;max-width:72ch}
.sec p:last-child{margin-bottom:0}
.sec ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.sec ul li{position:relative;padding-left:22px;max-width:72ch}
.sec ul li::before{content:"";position:absolute;left:4px;top:.62em;width:7px;height:7px;border-radius:2px;background:var(--tc);transform:rotate(45deg)}
.sec ul ul{margin-top:8px}
.sec ul ul li::before{background:transparent;border:1.5px solid var(--tc);width:6px;height:6px;border-radius:50%;transform:none}
.callout{display:flex;gap:12px;padding:14px 16px;border-radius:14px;margin-top:12px;font-size:14.5px;line-height:1.55}
.callout svg{width:20px;height:20px;flex:none;margin-top:1px}
.callout.info{background:var(--accent-soft)}
.callout.info svg{color:var(--accent)}
.callout.warn{background:var(--warn-soft)}
.callout.warn svg{color:var(--warn)}
.callout.good{background:var(--good-soft)}
.callout.good svg{color:var(--good)}

/* steps */
.roadbar{position:relative;height:46px;margin:2px 0 18px;border-radius:12px;background:var(--road);overflow:hidden}
.roadbar::before{content:"";position:absolute;left:12px;right:12px;top:50%;height:3px;margin-top:-1.5px;background:repeating-linear-gradient(90deg,var(--road-line) 0 18px,transparent 18px 32px);opacity:.8}
.roadbar .fill{position:absolute;left:0;top:0;bottom:0;background:color-mix(in srgb,var(--tc) 30%,transparent);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.roadbar .rig{position:absolute;top:50%;width:62px;height:30px;margin-top:-17px;transition:left .6s cubic-bezier(.2,.8,.2,1)}
.roadbar .flag{position:absolute;right:10px;top:50%;transform:translateY(-50%);font:600 11px/1 var(--f-mono);color:#fff;background:rgba(255,255,255,.12);padding:5px 8px;border-radius:6px}
.steps{display:flex;flex-direction:column;gap:0;counter-reset:s}
.step{display:grid;grid-template-columns:40px minmax(0,1fr);gap:16px;position:relative;padding-bottom:18px}
.step:last-child{padding-bottom:0}
.step::before{content:"";position:absolute;left:19px;top:40px;bottom:0;width:2px;background:repeating-linear-gradient(180deg,var(--line-2) 0 5px,transparent 5px 10px)}
.step:last-child::before{display:none}
.step .num{width:40px;height:40px;border-radius:12px;border:2px solid var(--line-2);background:var(--surface);display:grid;place-items:center;font:700 15px/1 var(--f-display);cursor:pointer;transition:.2s;color:var(--ink)}
.step .num:hover{border-color:var(--tc)}
.step.done .num{background:var(--tc);border-color:var(--tc);color:#fff}
.step.done .num span{display:none}
.step .num svg{width:18px;height:18px;display:none}
.step.done .num svg{display:block}
.step h3{font:700 16.5px/1.3 var(--f-display);margin:9px 0 10px;cursor:pointer}
.step.done h3{color:var(--muted)}
.step-tools{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line);font-size:13px;color:var(--muted);flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-2);background:var(--surface);border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink);text-decoration:none}
.btn:hover{border-color:var(--faint)}
.btn svg{width:15px;height:15px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}

/* reactions */
.reacts{display:grid;gap:10px}
.react{display:grid;grid-template-columns:minmax(0,200px) minmax(0,1fr);gap:16px;padding:14px 16px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line)}
.react b{font:700 14px/1.4 var(--f-display)}
.react p{margin:0;font-size:14.5px;color:var(--muted)}

.takeaway{background:linear-gradient(135deg,color-mix(in srgb,var(--tc) 14%,var(--surface)),var(--surface) 70%)}
.takeaway p{font-size:16px}

/* templates */
.tpl{border:1px solid var(--line-2);border-radius:14px;overflow:hidden;background:var(--surface-2);margin-top:4px}
.tpl + .tpl{margin-top:14px}
.tpl-head{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--surface);flex-wrap:wrap}
.tpl-head .dots{display:flex;gap:5px}
.tpl-head .dots i{width:9px;height:9px;border-radius:50%;background:var(--line-2)}
.tpl-head b{font-size:13px;flex:1;min-width:0}
.tpl-subj{padding:10px 16px;font-size:13.5px;border-bottom:1px dashed var(--line-2);overflow-wrap:anywhere}
.tpl-subj span{color:var(--faint)}
.tpl pre{margin:0;padding:14px 16px;white-space:pre-wrap;font:14px/1.6 var(--f-body);color:var(--ink);overflow-wrap:anywhere}
.ph{font-family:var(--f-mono);font-size:.84em;background:var(--accent-soft);color:var(--accent);padding:1px 5px;border-radius:5px}

/* examples */
.ex-list{display:flex;flex-direction:column;gap:8px}
.ex{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);text-decoration:none;color:var(--ink);font-size:14px}
.ex:hover{border-color:var(--line-2)}
.ex svg{width:18px;height:18px;color:var(--tc);flex:none}
.ex span{flex:1;min-width:0}
.ex small{color:var(--faint);font-size:12px}

/* rail */
.rail{position:sticky;top:86px;display:flex;flex-direction:column;gap:16px}
.rail-box{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.rail-box h4{margin:0 0 10px;font:700 10.5px/1 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.toc{display:flex;flex-direction:column;gap:2px;position:relative}
.toc a{font-size:13.5px;color:var(--muted);text-decoration:none;padding:6px 10px;border-radius:8px;border-left:2px solid transparent}
.toc a:hover{color:var(--ink);background:var(--surface-2)}
.toc a.on{color:var(--ink);border-left-color:var(--tc);background:var(--surface-2);font-weight:600}
.rel{display:flex;flex-direction:column;gap:6px}
.rel a{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;text-decoration:none;color:var(--ink);font-size:13.5px;font-weight:600}
.rel a:hover{background:var(--surface-2)}
.rel .tile{width:30px;height:30px;border-radius:9px;box-shadow:none}
.rel .tile svg{width:16px;height:16px}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:6px}
.pager a{display:flex;flex-direction:column;gap:4px;padding:16px 18px;border-radius:16px;border:1px solid var(--line);background:var(--surface);text-decoration:none;color:var(--ink);box-shadow:var(--shadow);transition:transform .2s}
.pager a:hover{transform:translateY(-2px)}
.pager a.next{text-align:right}
.pager small{color:var(--faint);font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.pager b{font:700 16px/1.3 var(--f-display)}

/* widgets */
.wgt{border:1px solid var(--line-2);border-radius:16px;padding:18px;background:var(--surface-2);margin-top:6px}
.calc{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:13px;font-weight:600;display:flex;justify-content:space-between}
.field label output{font-family:var(--f-mono);color:var(--accent)}
input[type=range]{width:100%;accent-color:var(--accent)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;cursor:pointer;padding:8px 0}
.check input{width:17px;height:17px;accent-color:var(--accent);margin-top:2px;flex:none}
.bars{display:flex;flex-direction:column;gap:12px}
.barrow{display:grid;grid-template-columns:110px minmax(0,1fr) 72px;gap:10px;align-items:center;font-size:13px}
.barrow .track{height:14px;border-radius:7px;background:var(--line);overflow:hidden}
.barrow .track i{display:block;height:100%;border-radius:7px;transition:width .4s}
.barrow b{font-family:var(--f-mono);font-size:13px;text-align:right;font-variant-numeric:tabular-nums}
.verdict{margin-top:14px;padding:12px 14px;border-radius:12px;font-weight:600;font-size:14px;display:flex;gap:10px;align-items:center}
.verdict.good{background:var(--good-soft);color:var(--good)}
.verdict.warn{background:var(--warn-soft);color:var(--warn)}
.verdict svg{width:18px;height:18px;flex:none}
.note{font-size:12px;color:var(--faint);margin-top:10px}

.pallets{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.pallet-grp{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);min-width:0}
.pallet-grp small{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.pallet-row{display:flex;gap:8px}
.pal{width:44px;height:48px;position:relative}
.pal::before{content:"";position:absolute;left:2px;right:2px;top:0;height:36px;border-radius:5px;background:linear-gradient(160deg,#e9c48c,#c99a57);box-shadow:inset 0 -2px 0 rgba(0,0,0,.1)}
.pal::after{content:"";position:absolute;left:0;right:0;bottom:2px;height:8px;border-radius:2px;background:repeating-linear-gradient(90deg,#8d6a3c 0 8px,transparent 8px 13px);border-top:3px solid #a47b46}
.pal.lost::before{background:transparent;border:2px dashed var(--bad)}
.pal.lost::after{opacity:.25}
.pal.lost span{position:absolute;left:0;right:0;top:9px;text-align:center;font:800 16px/1 var(--f-display);color:var(--bad)}
.pal-arrow{color:var(--faint);font-size:20px}

.curb{width:100%;height:auto;display:block}
.shop{background:var(--surface);border:1px solid var(--line-2);border-radius:14px;max-width:460px;box-shadow:var(--shadow)}
.shop-h{display:flex;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line);font-weight:700;font-size:14px}
.shop-b{padding:14px 16px;display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,.8fr);gap:10px}
.shop-b label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px}
.shop-b .in{border:1px solid var(--line-2);border-radius:8px;padding:7px 9px;font-size:13px;background:var(--surface-2);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.shop-c{padding:0 16px 12px;font-size:13px;display:flex;flex-direction:column;gap:6px}
.shop-c span{display:flex;gap:8px;align-items:center}
.cb{width:15px;height:15px;border-radius:4px;border:1.5px solid var(--faint);display:inline-grid;place-items:center}
.cb.on{background:var(--ink);border-color:var(--ink)}
.cb.on::after{content:"";width:7px;height:4px;border:2px solid var(--surface);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.shop-f{display:flex;justify-content:flex-end;gap:8px;padding:10px 16px;border-top:1px solid var(--line)}
.shop-f span{font-size:12.5px;font-weight:600;padding:6px 10px;border-radius:8px;border:1px solid var(--line-2)}
.shop-f span:last-child{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.rma{max-width:420px;background:var(--surface);border:1px solid var(--line-2);border-radius:14px;overflow:hidden}
.rma div{display:flex;justify-content:space-between;padding:10px 16px;font-size:14px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.rma div:last-child{border-bottom:0;font-weight:700;background:var(--surface-2)}
.rma .neg{color:var(--bad);font-family:var(--f-mono);font-size:13px}
.rma .code{font-family:var(--f-mono);font-size:12px;background:var(--bad-soft);color:var(--bad);padding:2px 6px;border-radius:5px;margin-left:6px}
.gate{display:flex;flex-direction:column;gap:2px}
.status{display:inline-flex;align-items:center;gap:8px;margin-top:12px;padding:10px 14px;border-radius:12px;font-weight:600;font-size:14px}
.status.wait{background:var(--warn-soft);color:var(--warn)}
.status.go{background:var(--good-soft);color:var(--good)}
.status i{width:9px;height:9px;border-radius:50%;background:currentColor}

.ctable{width:100%;border-collapse:collapse;font-size:14px;min-width:460px}
.ctable th{text-align:left;font:700 10.5px/1 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--faint);padding:0 12px 10px}
.ctable td{padding:12px;border-top:1px solid var(--line);vertical-align:middle}
.ctable td.ph-n{font-family:var(--f-mono);font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}
.carrier{display:flex;align-items:center;gap:10px;font-weight:600}
.carrier i{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font:800 10px/1 var(--f-display);color:#fff;font-style:normal}
.scroll-x{overflow-x:auto;margin:0 -6px;padding:0 6px}
.copy{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:5px 9px;font-size:12px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;color:var(--muted);white-space:nowrap}
.copy:hover{color:var(--ink)}
.copy svg{width:13px;height:13px}
.copy.ok{color:var(--good);border-color:var(--good)}
.dims{display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-size:14px}
.dim{padding:12px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);min-width:0}
.dim small{display:block;font-size:11px;color:var(--faint);font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
.dim b{font-family:var(--f-mono);font-size:15px}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:13.5px;font-weight:600;transition:.25s;z-index:60;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
.scrim{display:none}

@media (max-width:1180px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.layout{grid-template-columns:minmax(0,1fr)}.rail{position:static;display:none}.triage{grid-template-columns:minmax(0,1fr)}}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:0;bottom:0;height:auto;width:280px;transform:translateX(-100%);transition:transform .25s;box-shadow:var(--shadow-lift);padding-top:calc(26px + env(safe-area-inset-top,0px))}
  .app.open .side{transform:none}
  .app.open .scrim{display:block;position:fixed;inset:0;background:rgba(10,6,20,.35);z-index:25}
  .menu-btn{display:grid}
  .chip-inbox .t{display:none}
  .who .n{display:none}
  .thead{grid-template-columns:minmax(0,1fr)}
  .minitruck{display:none}
}
@media (max-width:640px){
  .grid,.tri-list{grid-template-columns:minmax(0,1fr)}
  .stage{height:210px;--sc:.6}
  .world{--sc:.6}
  .badge.hide-sm{display:none}
  .calc{grid-template-columns:minmax(0,1fr)}
  .react{grid-template-columns:minmax(0,1fr);gap:4px}
  .sec{padding:20px 18px}
  .thead{padding:24px 20px}
  .pager{grid-template-columns:minmax(0,1fr)}
  .shop-b{grid-template-columns:minmax(0,1fr)}
  .top .search.compact kbd{display:none}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<body>
<div class="app" id="app">
  <aside class="side" id="side" aria-label="Freight Hub navigation">
    <a class="back-port" id="backPort" href="../../"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7"/><path d="M5.5 9.5V20h13V9.5"/><path d="M10 20v-5.5h4V20"/></svg><span>Back to Resume Hub</span></a>
    <a class="brand" href="#home">
      <span class="brand-mark"><i></i><i></i></span>
      <span><b>Freight Hub</b><small>Training &amp; SOPs</small></span>
    </a>
    <nav class="nav" id="nav"></nav>
    <div class="tip">
      <div class="bulb"><span></span></div>
      <h4>Golden rule</h4>
      <p>Document everything. Every carrier email gets moved into the customer's timeline so the whole team can see it.</p>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <main class="main">
    <header class="top">
      <button class="icon-btn menu-btn" id="menuBtn" aria-label="Open navigation"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg></button>
      <div class="grow"><div class="search compact" id="topSearchWrap" hidden></div></div>
      <button class="chip-inbox" id="inboxBtn" title="Copy the freight inbox address"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m4 7 8 6 8-6"/></svg><span class="t">freight@yourcompany.com</span></button>
      <button class="icon-btn" id="themeBtn" aria-label="Toggle light or dark theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg></button>
      <div class="who"><span class="avatar">FT</span><span class="n">Freight Team</span></div>
    </header>
    <div class="view" id="view"></div>
  </main>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
/* ================= icons ================= */
const I = {
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7.5" height="7.5" rx="2.2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2.2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2.2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2.2"/></svg>',
  overview:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 4l9 6.5"/><path d="M5 9.5V20h14V9.5"/><path d="M9 20v-5h6v5"/></svg>',
  hold:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/></svg>',
  dock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5 12 5l9 4.5v8L12 22l-9-4.5z"/><path d="m3 9.5 9 4.5 9-4.5M12 14v8"/><circle cx="18.5" cy="5" r="3.2" fill="currentColor" stroke="none" opacity=".35"/></svg>',
  recon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-6.5-5.6-6.5-11A6.5 6.5 0 0 1 18.5 10c0 5.4-6.5 11-6.5 11Z"/><path d="M9.5 10h5m-2-2 2 2-2 2"/></svg>',
  rts:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>',
  special:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V8l8-5 8 5v13"/><path d="M9 21v-6h6v6M12 8.5l.9 1.8 2 .3-1.45 1.4.35 2-1.8-.95-1.8.95.35-2L9.1 10.6l2-.3z"/></svg>',
  rescue:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.6"/><path d="m5.6 5.6 3.9 3.9m5 5 3.9 3.9m0-12.8-3.9 3.9m-5 5-3.9 3.9"/></svg>',
  returns:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2.5"/><path d="M8 8h8M8 12h8M8 16h4"/></svg>',
  toolkit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h4l2 4-2.5 1.5a11 11 0 0 0 6 6L16 13l4 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg>',
  search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18 9 12l6-6"/></svg>',
  arrow:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M8 7h9v9"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>',
  info:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>',
  warn:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 2 20h20z"/><path d="M12 10v4.5M12 17.5v.3"/></svg>',
  copy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="12" height="12" rx="2.5"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>',
  link:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>',

async function copyText(text, btn){

/* ================= search index ================= */
function sectionText(t,s){
  let parts=[s.t];
  if(s.html) parts.push(s.html);
  if(s.items) parts.push(...s.items.flat());
  if(s.steps) s.steps.forEach(([h,b])=>parts.push(h,...b));
  if(s.callout) parts.push(s.callout[1]);
  if(s.links) parts.push(...s.links.map(l=>l[0]));
  if(s.ids) s.ids.forEach(id=>{const tp=TEMPLATES[id];parts.push(tp.name,tp.subject,tp.body)});
  const extra={calc:'storage fees per day hold vs return reship calculator cost $600',pallets:'pallet missing lost terminal misloaded mis-scanned',
    shopify:'Shopify invoice custom item Freight Reconsignment Fees price taxable physical product',rma:'RTS fee RMA refund NetSuite deduct return fee',
    sdform:'written confirmation checklist delivery location inside rooms stairs garage driveway weekend weekday delivery windows gated entry freight elevator limited hours timeline',
    gate:'experienced driver smaller box truck transfer nearby terminal alternatives before rescue TQL',
    contacts:CARRIERS.map(c=>c[0]+' '+c[1]).join(' ')+' TQL freight inbox phone contact rescue special delivery',
    dims:'pallet dims example crate 45.3x37.8x27.9 48x40x60',
    curb:'curbside driveway garage liability tip driver discretion',scen:'dock check reconsignment return to sender special delivery rescue'};
  return strip(parts.join(' '))+(extra[s.type]?' ␞ '+extra[s.type]:'');
}
const INDEX = TOPICS.flatMap(t=>[{t,si:-1,title:t.title,text:strip([t.title,t.card,t.summary,t.tags.join(' '),t.facts.flat().join(' ')].join(' '))},
  ...t.sections.map((s,si)=>({t,si,title:s.t,text:sectionText(t,s)}))]);

function search(q){
  const words=q.toLowerCase().split(/\s+/).filter(w=>w.length>0);
  if(!words.length) return [];
  const out=[];
  for(const e of INDEX){
    const hay=(e.title+' '+e.text).toLowerCase();
    if(!words.every(w=>hay.includes(w))) continue;
    let score=0;
    for(const w of words){
      if(e.t.title.toLowerCase().includes(w)) score+=8;
      if(e.title.toLowerCase().includes(w)) score+=5;
      score+=Math.min(4,hay.split(w).length-1);
    }
    if(e.si===-1) score+=2;
    out.push({...e,score});
  }
  out.sort((a,b)=>b.score-a.score);
  const seen=new Set(), res=[];
  for(const r of out){const k=r.t.id+'|'+r.si;if(seen.has(k))continue;seen.add(k);res.push(r);if(res.length>=8)break}
  return res.map(r=>({...r,snip:snippet(r.text,words)}));
}
function snippet(text,words){
  text=text.split(' ␞ ')[0];
  const low=text.toLowerCase();let i=low.indexOf(words[0]);if(i<0)i=0;
  const start=Math.max(0,i-50);let s=(start>0?'…':'')+text.slice(start,start+150)+(start+150<text.length?'…':'');
  s=esc(s);
  for(const w of words){ if(w.length<2) continue; s=s.replace(new RegExp('('+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<mark>$1</mark>') }
  return s;
}
function mountSearch(wrap, compact){
  wrap.innerHTML=`${I.search}<input type="search" id="${compact?'q-top':'q-hero'}" autocomplete="off" placeholder="${compact?'Search topics, steps, fees…':'Search freight topics, steps, fees, carriers… try “BOL”, “storage”, “liftgate”'}" aria-label="Search the Freight Hub"><kbd>/</kbd><div class="results" hidden role="listbox"></div>`;
  const inp=$('input',wrap), box=$('.results',wrap); let items=[], cur=0;
  const render=()=>{
    const q=inp.value.trim();
    if(q.length<2){box.hidden=true;return}
    items=search(q);cur=0;
    box.innerHTML=items.length?items.map((r,i)=>`<div class="res${i===0?' on':''}" data-i="${i}" role="option">${tile(r.t,'ti')}<div style="min-width:0"><b>${esc(r.t.title)}${r.si>=0?` <span>› ${esc(r.title)}</span>`:''}</b><p>${r.snip}</p></div></div>`).join('')
      :`<div class="res-empty">No matches for “${esc(q)}”. Try a carrier name, “pallet”, “invoice” or “fees”.</div>`;
    box.hidden=false;
  };
  const go=i=>{const r=items[i];if(!r)return;box.hidden=true;inp.value='';inp.blur();openTopic(r.t.id,r.si)};
  inp.addEventListener('input',render);
  inp.addEventListener('focus',render);
  inp.addEventListener('keydown',e=>{
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(!items.length)return;cur=(cur+(e.key==='ArrowDown'?1:-1)+items.length)%items.length;box.querySelectorAll('.res').forEach((el,i)=>el.classList.toggle('on',i===cur));box.querySelectorAll('.res')[cur]?.scrollIntoView({block:'nearest'})}
    else if(e.key==='Enter'){e.preventDefault();go(cur)}
    else if(e.key==='Escape'){box.hidden=true;inp.blur()}
  });
  box.addEventListener('mousedown',e=>{const el=e.target.closest('.res');if(el){e.preventDefault();go(+el.dataset.i)}});
  inp.addEventListener('blur',()=>setTimeout(()=>box.hidden=true,120));
  return inp;
}

/* ================= 3D truck ================= */
function cuboid(x,y,z,w,d,h,col,faceHTML={}){
  const b=document.createElement('div');b.className='cub';
  b.style.cssText=`left:${x}px;top:${y}px;width:${w}px;height:${d}px;transform:translateZ(${z}px)`;
  const f=(css,bg,html='')=>`<i style="${css};background:${bg}">${html}</i>`;
  b.innerHTML=
    f(`width:${w}px;height:${d}px;transform:translateZ(${h}px)`,col[0],faceHTML.top||'')+
    f(`width:${w}px;height:${h}px;top:${d-h}px;transform-origin:bottom;transform:rotateX(-90deg)`,col[1],faceHTML.front||'')+
    f(`width:${w}px;height:${h}px;top:${-h}px;transform-origin:bottom;transform:rotateX(-90deg)`,col[1])+
    f(`width:${h}px;height:${d}px;left:${-h}px;transform-origin:right;transform:rotateY(90deg)`,col[2],faceHTML.left||'')+
    f(`width:${h}px;height:${d}px;left:${w-h}px;transform-origin:right;transform:rotateY(90deg)`,col[2]);
  return b;
}
function wheel(x,y){const w=document.createElement('div');w.className='wheel';w.style.cssText=`left:${x}px;top:${y-28}px;transform-origin:bottom;transform:rotateX(-90deg)`;return w}
function buildTruck(scene){
  const world=document.createElement('div');world.className='world';
  world.innerHTML='<div class="road"></div>';
  const truck=document.createElement('div');truck.className='truck';
  const D=72;

  truck.appendChild(cuboid(64,0,16,224,D,92,['#fbfaff','#6a45f5','#4d2fd0'],{front:'<div class="label3d">FREIGHT HUB<small>LTL · CURBSIDE</small></div>'}));
  // stripe on trailer roof
  truck.appendChild(cuboid(64,0,108.5,224,D,0.5,['repeating-linear-gradient(90deg,#efeaff 0 30px,#e2dafd 30px 32px)','transparent','transparent']));
  // cab
  truck.appendChild(cuboid(0,4,16,58,D-8,62,['#ffb36b','#f07a2a','#d5611b'],{left:'<div style="position:absolute;left:30px;right:6px;top:8px;bottom:8px;background:linear-gradient(160deg,#d8ecff,#8fbfea);border-radius:4px"></div>',front:'<div style="position:absolute;left:8px;width:26px;top:8px;height:22px;background:linear-gradient(160deg,#d8ecff,#8fbfea);border-radius:4px"></div>'}));
  truck.appendChild(cuboid(4,8,78,40,D-16,8,['#ffc489','#f07a2a','#d5611b']));
  // chassis
  truck.appendChild(cuboid(4,10,8,280,D-20,8,['#3a3550','#2a2639','#1f1c2c']));
  [[14],[84],[212],[244]].forEach(([x])=>{truck.appendChild(wheel(x,D+1));truck.appendChild(wheel(x,1))});
  world.appendChild(truck);
  // pallets on the ground behind the truck
  const pal=(x,y)=>{world.appendChild(cuboid(x,y,0,46,46,7,['#b78850','#8d6a3c','#7a5a30']));world.appendChild(cuboid(x+3,y+3,7,40,40,34,['#f0d3a3','#d9ac6a','#c4914d'],{front:'<div class="box-label">BOL · 1/3</div>'}))};
  pal(170,-80); pal(222,-80);
  world.appendChild(cuboid(225,-77,41,40,40,28,['#f5dcb1','#e2b878','#cc9c58']));
  scene.appendChild(world);
}

    <div class="wgt"><div class="dims"><div class="dim"><small>Product</small><b>Equipment crate</b><div style="font-size:12.5px;color:var(--muted)">Example product crate</div></div><div class="dim"><small>Crate dims</small><b>45.3 × 37.8 × 27.9</b></div><span class="pal-arrow">→</span><div class="dim" style="border-color:var(--tc)"><small>Enter in Pacejet</small><b>48 × 40 × 60</b></div></div></div>`},
  contacts(){
    return `<div class="scroll-x"><table class="ctable"><thead><tr><th>Carrier</th><th>Customer service</th><th></th></tr></thead><tbody>
      ${CARRIERS.map(([n,p,c,ab])=>`<tr><td><span class="carrier"><i style="background:${c}">${ab}</i>${n}</span></td><td class="ph-n" data-copy-text="${p}">${p}</td><td style="text-align:right">${copyBtn('Copy')}</td></tr>`).join('')}
      <tr><td><span class="carrier"><i style="background:#6a45f5">FT</i>Freight team inbox</span></td><td class="ph-n" data-copy-text="freight@yourcompany.com">freight@yourcompany.com</td><td style="text-align:right">${copyBtn('Copy')}</td></tr>
    </tbody></table></div>`+callout(['warn','Carrier portal logins (such as R+L) and the Pacejet login aren’t published here. Ask a freight lead for access.'])},
};

function secHTML(t,s,i){
  const id=`${t.id}-s${i}`;
  let body='';
  switch(s.type){
    case 'list': body=list(s.items);break;
    case 'prose': body=s.html;break;
    case 'takeaway': body=s.html;break;
    case 'steps': body=stepsHTML(t,s);break;
    case 'reacts': body=`<div class="reacts">${s.items.map(([a,b])=>`<div class="react"><b>${a}</b><p>${b}</p></div>`).join('')}</div>`;break;
    case 'tpls': body=s.ids.map(tplHTML).join('');break;
    case 'examples': body=links(s.links).replace('style="margin-top:12px"','');break;
    default: body=W[s.type]?W[s.type](s):'';
  }
  if(s.type!=='examples') body+=links(s.links);
  body+=callout(s.callout);
  return `<section class="sec${s.type==='takeaway'?' takeaway':''}" id="${id}"><h2>${s.type==='takeaway'?'':''}${esc(s.t)}</h2>${body}</section>`;
}
function stepsHTML(t,s){
  const key='fh-steps-'+t.id;
  return `<div class="roadbar" id="road-${t.id}"><div class="fill"></div><div class="rig">${rigSVG(t.c)}</div><span class="flag">0/${s.steps.length}</span></div>
  <div class="steps" data-key="${key}">${s.steps.map(([h,b],i)=>`<div class="step" data-i="${i}"><button class="num" aria-label="Mark step ${i+1} done"><span>${i+1}</span>${I.check}</button><div style="min-width:0"><h3>${h}</h3>${list(b)}</div></div>`).join('')}</div>
  <div class="step-tools"><span>Tap a step number to tick it off as you work the ticket.</span><button class="btn" data-reset>${I.reset}Reset</button></div>`;
}

function renderTopic(t, focusIdx){
  $('#topSearchWrap').hidden=false;
  const idx=TOPICS.indexOf(t), prev=TOPICS[(idx-1+TOPICS.length)%TOPICS.length], next=TOPICS[(idx+1)%TOPICS.length];
  const related=TOPICS.filter(x=>x!==t&&x.group==='Scenario').slice(0,4);
  view.innerHTML=`
  <nav class="crumbs"><a href="#home">${I.back}Freight Hub</a><span>/</span><span>${t.group}</span><span>/</span><span style="color:var(--ink);font-weight:600">${t.title}</span></nav>
  <header class="thead" style="--tc:${t.c}">
    <div style="min-width:0">${tile(t)}<div class="eyebrow" style="color:${t.c}">${t.group==='Scenario'?'Freight scenario':t.group}</div><h1>${t.title}</h1><p class="sum">${t.summary}</p>
    <div class="facts">${t.facts.map(([k,v])=>`<div class="fact"><small>${k}</small><b>${v}</b></div>`).join('')}</div></div>
    <div class="minitruck" aria-hidden="true">${miniScene(t)}</div>
  </header>
  <div class="layout" style="--tc:${t.c}">
    <div class="content">${t.sections.map((s,i)=>secHTML(t,s,i)).join('')}
      <div class="pager"><a href="#${prev.id}"><small>← Previous</small><b>${prev.title}</b></a><a class="next" href="#${next.id}"><small>Next →</small><b>${next.title}</b></a></div>
    </div>
    <aside class="rail">
      <div class="rail-box"><h4>On this page</h4><nav class="toc">${t.sections.map((s,i)=>`<a href="#${t.id}" data-sec="${i}">${esc(s.t)}</a>`).join('')}</nav></div>
      <div class="rail-box"><h4>Other playbooks</h4><div class="rel">${related.map(r=>`<a href="#${r.id}">${tile(r)}<span>${r.title}</span></a>`).join('')}<a href="#home">${tile({c:'#8c86a3',c2:'#b9b4cc',icon:'home'})}<span>All topics</span></a></div></div>
    </aside>
  </div>`;
  wireTopic(t);
  if(focusIdx!=null&&focusIdx>=0){const el=$('#'+t.id+'-s'+focusIdx);if(el){requestAnimationFrame(()=>{el.scrollIntoView({behavior:'smooth',block:'start'});el.classList.add('flash')})}}
  else window.scrollTo(0,0);
}
function miniScene(t){
  return `<svg viewBox="0 0 190 120"><ellipse cx="95" cy="104" rx="88" ry="12" fill="color-mix(in srgb,${t.c} 18%,transparent)"/>
  <g transform="translate(18 40)"><path d="M0 14 60 -10 120 14 60 38z" fill="${t.c2}"/><path d="M0 14v34l60 24V38z" fill="${t.c}"/><path d="M120 14v34L60 72V38z" fill="color-mix(in srgb,${t.c} 70%,#000)"/>
  <path d="M120 22l26-10 12 6v30l-38 14z" fill="#f07a2a"/><path d="M132 20l12-5 8 4-14 6z" fill="#cfe6ff"/>
  <circle cx="20" cy="60" r="7" fill="#1b1826"/><circle cx="96" cy="64" r="7" fill="#1b1826"/><circle cx="140" cy="56" r="6" fill="#1b1826"/>
  <g transform="translate(46 2)" fill="#fff" opacity=".95">${I[t.icon].replace('<svg','<svg width="28" height="28" x="0" y="0"').replace(/currentColor/g,'#fff')}</g></g></svg>`;
}

function wireTopic(t){
  // steps
  view.querySelectorAll('.steps').forEach(st=>{
    const key=st.dataset.key, steps=[...st.querySelectorAll('.step')];
    let done=store.get(key,[]);
    const road=$('#road-'+t.id);
    const paint=()=>{steps.forEach((s,i)=>s.classList.toggle('done',done.includes(i)));
      const n=done.length, pct=n/steps.length;
      if(road){road.querySelector('.fill').style.width=(pct*100)+'%';road.querySelector('.rig').style.left=`calc(${pct*100}% - ${pct*72}px + 6px)`;road.querySelector('.flag').textContent=n===steps.length?'Delivered ✓':`${n}/${steps.length}`}};
    const toggle=i=>{done=done.includes(i)?done.filter(x=>x!==i):[...done,i];store.set(key,done);paint()};
    steps.forEach((s,i)=>{s.querySelector('.num').addEventListener('click',()=>toggle(i));s.querySelector('h3').addEventListener('click',()=>toggle(i))});
    st.parentElement.querySelector('[data-reset]')?.addEventListener('click',()=>{done=[];store.set(key,done);paint()});
    paint();
  });
  // copy buttons
  view.querySelectorAll('[data-copy]').forEach(b=>b.addEventListener('click',()=>{
    const tpl=b.closest('[data-tpl]');
    if(tpl){const tp=TEMPLATES[tpl.dataset.tpl];copyText(`Subject: ${tp.subject}\n\n${tp.body}`,b);return}
    const row=b.closest('tr');if(row){copyText(row.querySelector('[data-copy-text]').dataset.copyText,b)}
  }));
  // calc
  if($('#hDays')){
    const upd=()=>{
      const days=+$('#hDays').value, rate=+$('#hRate').value, wk=$('#hWknd').checked;
      $('#oDays').textContent=days+(days===1?' day':' days');$('#oRate').textContent='$'+rate;
      let billable=Math.max(0,days-2); if(wk&&days>2) billable=Math.max(0,billable-2);
      const hold=billable*rate, rts=600, max=Math.max(hold,rts,1);
      $('#vHold').textContent='$'+hold.toLocaleString();$('#bHold').style.width=(hold/max*100)+'%';$('#bRts').style.width=(rts/max*100)+'%';
      const v=$('#verdict');
      if(hold<rts){v.className='verdict good';v.innerHTML=I.check+`<span>Hold it at the terminal. About $${(rts-hold).toLocaleString()} cheaper than return and reship.</span>`}
      else{v.className='verdict warn';v.innerHTML=I.warn+`<span>Return to sender and reship is likely cheaper, unless the customer pays for storage.</span>`}
    };
    ['hDays','hRate','hWknd'].forEach(id=>$('#'+id).addEventListener('input',upd));upd();
  }
  // special delivery copy
  $('#sdCopy')?.addEventListener('click',e=>{
    const qs=[...view.querySelectorAll('#sdq input:checked')].map(i=>'• '+i.dataset.q);
    if(!qs.length){toast('Pick at least one question to copy');return}
    copyText(`Hi there,\n\nHappy to look into a special delivery for you. Standard freight delivery is curbside, so anything beyond that is arranged separately with the carrier and comes with additional fees. To get an accurate quote, could you confirm the following in writing?\n\n${qs.join('\n')}\n\nOnce we have these details we’ll request a quote and share it with you before anything is scheduled.\n\nThank you!`,e.currentTarget);
  });
  // gate
  const gates=[...view.querySelectorAll('[id^="gate-"]')];
  if(gates.length){const upd=()=>{const all=gates.every(g=>g.checked),s=$('#gateStatus');s.className='status '+(all?'go':'wait');s.querySelector('span').textContent=all?'All alternatives explored. OK to request a rescue with TQL.':`Explore all three before requesting a rescue (${gates.filter(g=>g.checked).length}/3)`};gates.forEach(g=>g.addEventListener('change',upd));upd()}
  // toc
  const tocLinks=[...view.querySelectorAll('.toc a')];
  tocLinks.forEach(a=>a.addEventListener('click',e=>{e.preventDefault();$('#'+t.id+'-s'+a.dataset.sec).scrollIntoView({behavior:'smooth',block:'start'})}));
  if('IntersectionObserver' in window&&tocLinks.length){
    const io=new IntersectionObserver(ents=>{ents.forEach(en=>{if(en.isIntersecting){const i=en.target.id.split('-s').pop();tocLinks.forEach(a=>a.classList.toggle('on',a.dataset.sec===i))}})},{rootMargin:'-90px 0px -60% 0px'});
    view.querySelectorAll('.sec').forEach(s=>io.observe(s));
  }
}

let pendingFocus=null;
function openTopic(id,si){pendingFocus=si;if(location.hash==='#'+id){route()}else location.hash=id}
function route(){
  const id=(location.hash||'#home').slice(1);
  const t=byId(id);
  renderNav(t?t.id:'home');
  $('#app').classList.remove('open');
  if(t){renderTopic(t,pendingFocus);document.title=t.title+' · Freight Hub'}else{renderHome();window.scrollTo(0,0);document.title='Freight Hub'}
  pendingFocus=null;
}
window.addEventListener('hashchange',route);
mountSearch($('#topSearchWrap'),true);
document.addEventListener('keydown',e=>{
  if(e.key==='/'&&!/input|textarea/i.test(document.activeElement.tagName)){e.preventDefault();const h=$('#q-hero');(h&&h.offsetParent?h:$('#q-top')).focus()}
});
$('#menuBtn').addEventListener('click',()=>$('#app').classList.add('open'));
$('#scrim').addEventListener('click',()=>$('#app').classList.remove('open'));
$('#inboxBtn').addEventListener('click',e=>copyText('freight@yourcompany.com',e.currentTarget));
$('#themeBtn').addEventListener('click',()=>{
  const r=document.documentElement, cur=r.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  r.dataset.theme=cur==='dark'?'light':'dark';store.set('fh-theme',r.dataset.theme);
});
(()=>{const th=store.get('fh-theme',null);if(th)document.documentElement.dataset.theme=th})();
document.getElementById('backPort').addEventListener('click',e=>{try{if(document.referrer&&new URL(document.referrer).pathname.replace(/index\.html$/,'')===new URL('../../',location.href).pathname){e.preventDefault();history.back()}}catch(_){}});
route();
