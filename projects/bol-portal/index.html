<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Freight Returns BOL Portal</title>
    <script type="module" crossorigin src="./assets/demo-B4RCWnQz.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/demo-BcucDE5h.css">
  </head>
  <body>
    <div id="root"></div>
    <style>.hub-back{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:9999;display:inline-flex;align-items:center;gap:10px;padding:13px 22px 13px 16px;border-radius:999px;background:#1e221f;color:#fff!important;font:600 15px/1 "Montserrat",system-ui,-apple-system,sans-serif;text-decoration:none!important;box-shadow:0 0 0 3px rgba(159,192,138,.75),0 14px 34px -10px rgba(0,0,0,.5);transition:transform .2s}.hub-back:hover{transform:translateY(-2px)}.hub-back:focus-visible{outline:3px solid #9fc08a;outline-offset:3px}.hub-back svg{width:20px;height:20px;flex:none}@media (max-width:640px){.hub-back{right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));padding:12px 18px 12px 14px;font-size:14px}}@media print{.hub-back{display:none}}</style>
    <a class="hub-back" href="../../" onclick="try{if(document.referrer&&new URL(document.referrer).origin===location.origin){event.preventDefault();history.back()}}catch(e){}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7"/><path d="M5.5 9.5V20h13V9.5"/><path d="M10 20v-5.5h4V20"/></svg><span>Back to Resume Hub</span></a>
  </body>
</html>
